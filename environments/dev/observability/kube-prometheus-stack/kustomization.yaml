apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
- namerefs.yaml

resources:
- ../../../base/observability/kube-prometheus-stack
- secrets
- tls.yaml

configMapGenerator:
- behavior: create
  files:
  - values.yaml=values-kube-prometheus-stack.yaml
  name: values-kube-prometheus-stack

transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-relevant-here
    namespace: monitoring
  unsetOnly: true
