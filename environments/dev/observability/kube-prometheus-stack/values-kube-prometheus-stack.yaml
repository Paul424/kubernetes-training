grafana:
  ingress:
    enabled: true
    hosts:
      - grafana.dev.local
    path: /
    tls:
      - secretName: grafana-tls
        hosts:
        - grafana.dev.local

  grafana.ini:
    auth.generic_oauth:
      allow_sign_up: true
      api_url: https://keycloak.dev.local/realms/me-yoda/protocol/openid-connect/userinfo
      auth_url: https://keycloak.dev.local/realms/me-yoda/protocol/openid-connect/auth
      client_id: $__file{/etc/secrets/auth_generic_oauth/client_id}
      client_secret: $__file{/etc/secrets/auth_generic_oauth/client_secret}
      enabled: true
      name: keycloak
      role_attribute_path: Viewer
      scopes: openid grafana
      # token_url: https://keycloak.dev.local/realms/me-yoda/protocol/openid-connect/token
      token_url: http://keycloak.keycloak.svc.cluster.local/realms/me-yoda/protocol/openid-connect/token
      allow_assign_grafana_admin: true
      org_attribute_path: teams[?starts_with(@, '/teams')]
      org_mapping: /teams/team-ops:Ops /teams/team-sustaining:Sustaining /teams/team-yellow:Yellow
      role_attribute_path: contains(groups[*], 'monitoring-admins') && 'GrafanaAdmin' || contains(groups[*], 'monitoring-developers') && 'Editor' || 'Viewer'
    server:
      root_url: https://grafana.dev.local/

  extraSecretMounts:
  - defaultMode: 288
    mountPath: /etc/secrets/auth_generic_oauth
    name: auth-generic-oauth-secret
    readOnly: true
    secretName: grafana-sso-secret

prometheus:
  ingress:
    enabled: true
    hosts:
      - prometheus.dev.local
    paths:
      - /
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.dev.local

alertmanager:
  ingress:
    enabled: true
    hosts:
      - alertmanager.dev.local
    paths:
      - /
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.dev.local
