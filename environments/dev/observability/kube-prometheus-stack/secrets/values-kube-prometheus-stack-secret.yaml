apiVersion: v1
kind: Secret
metadata:
    name: values-kube-prometheus-stack-secret
stringData:
    values.yaml: |
        grafana:
            # Option 1: credentials in this sops encrypted secret
            # adminUser: admin
            # adminPassword: admin

            # Option 2: refer to another sops encrypted secret
            admin:
              existingSecret: grafana-secret
              userKey: user
              passwordKey: password
