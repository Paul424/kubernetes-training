apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-visualizer
  namespace: infra-visualizer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infra-visualizer-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infra-visualizer-reader-binding
subjects:
  - kind: ServiceAccount
    name: infra-visualizer
    namespace: infra-visualizer
roleRef:
  kind: ClusterRole
  name: infra-visualizer-reader
  apiGroup: rbac.authorization.k8s.io
