apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
- namerefs.yaml

resources:
- ../../../base/networking/traefik
- secrets

configMapGenerator:
- behavior: create
  files:
  - values.yaml=values-traefik.yaml
  name: values-traefik

transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-relevant-here
    namespace: traefik
  unsetOnly: true
