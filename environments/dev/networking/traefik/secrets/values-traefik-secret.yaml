apiVersion: v1
kind: Secret
metadata:
    name: values-traefik-secret
stringData:
    values.yaml: |
        extraObjects:
        - apiVersion: v1
            kind: Secret
            metadata:
            name: traefik-dashboard-auth-secret
            type: kubernetes.io/basic-auth
            stringData:
            username: traefik
            password: traefik

        - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
            name: traefik-dashboard-auth
            spec:
            basicAuth:
                secret: traefik-dashboard-auth-secret
