production: false
httpEnabled: true
proxyHeaders: xforwarded
hostnameStrict: true

ingress:
  enabled: true
  ingressClassName: traefik
  hostname: keycloak.dev.local
  tls: true
  selfSigned: false
  annotations:
    cert-manager.io/issuer: keycloak-ca-issuer

global:
  defaultStorageClass: csi-hostpath-sc
  security:
    allowInsecureImages: true

image:
  # registry: docker.io
  repository: bitnamilegacy/keycloak
  # tag: 26.3.3-debian-12-r0

postgresql:
  image:
    # registry: docker.io
    repository: bitnamilegacy/postgresql
    # tag: 17.6.0-debian-12-r0

# extraVolumes:
#   - name: keycloak-realm
#     secret:
#       secretName: keycloak-realm

# extraVolumeMounts:
#   - name: keycloak-realm
#     mountPath: /opt/bitnami/keycloak/data/import
#     readOnly: true

extraStartupArgs: "--import-realm"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 750m
    memory: 2048Mi