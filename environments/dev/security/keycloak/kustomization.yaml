apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
- namerefs.yaml

resources:
- ../../../base/security/keycloak
- secrets
- tls.yaml

configMapGenerator:
- behavior: create
  files:
  - values.yaml=values-keycloak.yaml
  name: values-keycloak

transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-relevant-here
    namespace: keycloak
  unsetOnly: true
