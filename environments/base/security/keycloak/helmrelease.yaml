apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
spec:
  targetNamespace: keycloak
  releaseName: keycloak
  interval: 3m
  chart:
    spec:
      chart: ./charts/keycloak-25.2.0.tgz
      sourceRef:
        kind: GitRepository
        name: kubernetes-training
        namespace: env
  test:
    enable: false
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: -1
  upgrade:
    timeout: 10m
    remediation:
      retries: 5
      remediateLastFailure: true
    cleanupOnFail: true
  rollback:
    timeout: 10m
    cleanupOnFail: false
  valuesFrom:
    - kind: Secret
      name: common-keycloak-secret
    - kind: ConfigMap
      name: common-keycloak
    - kind: Secret
      name: values-keycloak-secret
    - kind: ConfigMap
      name: values-keycloak
