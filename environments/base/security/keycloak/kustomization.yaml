apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
- namerefs.yaml

resources:
- namespace.yaml
- secrets
- helmrelease.yaml

configMapGenerator:
- behavior: create
  files:
  - values.yaml=common-keycloak.yaml
  name: common-keycloak

transformers:
- |-
  apiVersion: builtin
  kind: NamespaceTransformer
  metadata:
    name: not-relevant-here
    namespace: keycloak
  unsetOnly: true
