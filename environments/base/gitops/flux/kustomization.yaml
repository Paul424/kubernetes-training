apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- gotk-components.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: whatever
      spec:
        template:
          metadata:
            annotations:
              # Required by Kubernetes node autoscaler
              cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
          spec:
            terminationGracePeriodSeconds: 60
            # Required by Pod Security Policy
            securityContext:
              runAsUser: 1000
              fsGroup: 1000
            containers:
              - name: manager
                # Required by Pod Security Policy
                securityContext:
                  runAsUser: 1000
                  runAsGroup: 1000
                  privileged: false
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop:
                      - ALL
                  $patch: replace
  - target:
      kind: ServiceAccount
      name: helm-controller
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: helm-controller
      automountServiceAccountToken: false
  - target:
      kind: Deployment
      name: helm-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: helm-controller
      spec:
        template:
          spec:
            automountServiceAccountToken: true
            containers:
            - name: manager
              resources:
                limits:
                  cpu: 1800m
                  memory: 2Gi
                requests:
                  cpu: 900m
                  memory: 1Gi
  - target:
      kind: ServiceAccount
      name: kustomize-controller
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: kustomize-controller
      automountServiceAccountToken: false
  - target:
      kind: Deployment
      name: kustomize-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kustomize-controller
      spec:
        template:
          spec:
            automountServiceAccountToken: true
            containers:
            - name: manager
              resources:
                limits:
                  cpu: 600m
                  memory: 1200Mi
                requests:
                  cpu: 300m
                  memory: 600Mi
  - target:
      kind: ServiceAccount
      name: notification-controller
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: notification-controller
      automountServiceAccountToken: false
  - target:
      kind: Deployment
      name: notification-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notification-controller
      spec:
        template:
          spec:
            automountServiceAccountToken: true
            containers:
            - name: manager
              resources:
                limits:
                  cpu: 200m
                  memory: 400Mi
                requests:
                  cpu: 100m
                  memory: 200Mi
  - target:
      kind: ServiceAccount
      name: source-controller
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: source-controller
      automountServiceAccountToken: false
  - target:
      kind: Deployment
      name: source-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: source-controller
      spec:
        template:
          spec:
            automountServiceAccountToken: true
            containers:
            - name: manager
              resources:
                limits:
                  cpu: 600m
                  memory: 800Mi
                requests:
                  cpu: 300m
                  memory: 384Mi
